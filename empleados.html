<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fábrica de Pastas - Empleados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <div id="app-interno" class="hidden flex h-screen overflow-hidden">
        <aside id="sidebar-placeholder"></aside>

        <main id="contenido-modulo" class="flex-1 overflow-y-auto bg-slate-50 p-8">
<section id="sec-empleados" class="space-y-6">
                <div id="vista-listado-empleados" class="space-y-6">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="p-2.5 bg-rose-100 text-rose-600 rounded-xl"><i data-lucide="id-card" class="w-5 h-5"></i></div>
                            <div>
                                <h2 class="text-2xl font-bold text-slate-900">Nómina de Empleados</h2>
                                <p class="text-sm text-slate-500">Gestión del personal de la empresa.</p>
                            </div>
                        </div>
                        <button onclick="mostrarSubvistaEmpleados('cargar-empleado')" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-lg text-sm font-semibold flex items-center space-x-2 shadow-sm transition">
                            <i data-lucide="user-plus" class="w-4 h-4"></i>
                            <span>Registrar Nuevo Empleado</span>
                        </button>
                    </div>

                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center gap-3">
                            <div class="relative flex-1 sm:max-w-xs">
                                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                                <input type="text" id="buscar-empleado" oninput="aplicarFiltroEmpleados()" placeholder="Buscar por nombre, legajo o documento..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-red-500">
                            </div>
                            <select id="filtro-empleado-cargo" onchange="aplicarFiltroEmpleados()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none bg-white">
                                <option value="">Todos los cargos</option>
                            </select>
                        </div>
                        <table class="w-full text-xs text-left">
                            <thead class="bg-slate-50 uppercase text-slate-500 border-b border-slate-200">
                                <tr>
                                    <th class="p-3">Legajo</th>
                                    <th class="p-3">Nombre y Apellido</th>
                                    <th class="p-3">CUIL / DNI</th>
                                    <th class="p-3">Cargo</th>
                                    <th class="p-3">Dirección Completa</th>
                                    <th class="p-3">Teléfono</th>
                                    <th class="p-3">Email</th>
                                    <th class="p-3">Fecha Nacimiento</th>
                                    <th class="p-3">Fecha Ingreso</th>
                                    <th class="p-3 text-right">Sueldo Básico</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-lista-empleados" class="divide-y divide-slate-100">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="vista-cargar-empleado" class="space-y-6 hidden">
                    <div class="flex items-center space-x-3">
                        <button type="button" onclick="mostrarSubvistaEmpleados('listado')" class="p-2 hover:bg-slate-200 rounded-lg text-slate-600 transition flex items-center justify-center">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                        </button>
                        <div>
                            <h2 class="text-2xl font-bold text-slate-900">Alta de Empleado</h2>
                            <p class="text-sm text-slate-500">Ingrese la información personal y laboral del empleado.</p>
                        </div>
                    </div>

                    <div class="max-w-3xl bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre *</label>
                                <input type="text" id="emp-nombre" placeholder="Ej: Mario" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-red-500">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Apellido *</label>
                                <input type="text" id="emp-apellido" placeholder="Ej: Rossi" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-red-500">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tipo Doc. *</label>
                                    <select id="emp-tipo-documento" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none">
                                        <option value="CUIL">CUIL</option>
                                        <option value="DNI">DNI</option>
                                        <option value="CUIT">CUIT</option>
                                        <option value="Pasaporte">Pasaporte</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">N° Documento *</label>
                                    <input type="text" id="emp-numero-documento" placeholder="30123456" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-red-500">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha de Nacimiento *</label>
                                <input type="date" id="emp-fecha-nacimiento" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-red-500">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Provincia</label>
                                <select id="emp-provincia" onchange="cargarLocalidadesCascada('emp')" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none">
                                    <option value="">-- Seleccione Provincia --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Localidad</label>
                                <select id="emp-localidad" onchange="cargarCallesCascada('emp')" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none" disabled>
                                    <option value="">-- Seleccione Localidad --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Calle</label>
                                <select id="emp-calle" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none" disabled>
                                    <option value="">-- Seleccione Calle --</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Altura</label>
                                <input type="text" id="emp-altura" placeholder="Ej: 1234" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Teléfono</label>
                                <input type="text" id="emp-telefono" placeholder="(011) 15-0000-0000" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
                                <input type="email" id="emp-email" placeholder="empleado@pastas.com" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Cargo / Puesto de Trabajo</label>
                                <select id="emp-cargo" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none">
                                    <option>Maestro Pastero (Producción)</option>
                                    <option>Ayudante de Cocina</option>
                                    <option>Atención al Cliente / Mostrador</option>
                                    <option>Administrador / Contador</option>
                                    <option>Repartidor / Logística</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha de Ingreso</label>
                                <input type="date" id="emp-fecha" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Sueldo Básico ($)</label>
                                <input type="number" id="emp-sueldo" placeholder="400000" value="400000" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm outline-none">
                            </div>
                        </div>

                        <div class="flex justify-end space-x-3 pt-4 border-t border-slate-100">
                            <button type="button" onclick="mostrarSubvistaEmpleados('listado')" class="bg-slate-100 text-slate-600 px-4 py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-200">Cancelar</button>
                            <button type="button" onclick="guardarNuevoEmpleado()" class="bg-red-600 text-white px-6 py-2.5 rounded-lg text-sm font-semibold hover:bg-red-700 flex items-center space-x-2">
                                <i data-lucide="save" class="w-4 h-4"></i>
                                <span>Registrar Empleado</span>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/shell.js"></script>
    <script src="js/empleados.js"></script>
    <script>
        initShell('empleados', initPaginaEmpleados);
    </script>
</body>
</html>
